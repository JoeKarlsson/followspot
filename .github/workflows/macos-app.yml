name: macOS app

# Builds dist/Followspot.app and checks the app's own parts: the bundle,
# that its whisper-server starts, serves the page and transcribes, that it
# passes the launcher's flags, and that quitting stops it. Transcription and
# tracking quality are ci.yml's job (the Linux end-to-end check), so this
# sends a single short clip rather than replaying a whole script, which took
# 10+ minutes on the CPU-only macOS runner. Not a required check.
#
# Every run uploads Followspot-<version>.dmg as a workflow artifact; pushing a
# v* tag also attaches it to a GitHub Release. Path filters don't apply to
# tag pushes, so a release always builds.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "macos/**"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-app.yml"

permissions:
  contents: read

env:
  WHISPER_CPP_VERSION: v1.9.4

jobs:
  app:
    name: Build and smoke-test Followspot.app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache the bundled whisper-server
        id: whisper-cache
        uses: actions/cache@v6
        with:
          path: macos/.whisper/whisper-server
          key: app-whisper-server-${{ env.WHISPER_CPP_VERSION }}-${{ runner.arch }}-${{ hashFiles('macos/build-whisper.sh') }}
      - name: Build whisper-server (static, Metal embedded)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: macos/build-whisper.sh
      - name: Swift checks (download resume and checksums, flags, versions)
        run: macos/test.sh
      - name: Build Followspot.app
        run: macos/build.sh
      - name: Check the bundle
        run: |
          app=dist/Followspot.app
          test -x "$app/Contents/Helpers/whisper-server"
          test -f "$app/Contents/Resources/public/index.html"
          test ! -e "$app/Contents/Resources/public/current.md"
          # Only system libraries: nothing from Homebrew, which users won't have.
          if otool -L "$app/Contents/Helpers/whisper-server" | grep -E "/opt/homebrew|/usr/local"; then
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
      - name: Cache Whisper and VAD models
        uses: actions/cache@v6
        with:
          path: |
            models/ggml-base.en.bin
            models/ggml-silero-v6.2.0.bin
          key: whisper-ggml-base.en-silero-v6.2.0-v1
      - name: Download models
        run: |
          test -f models/ggml-base.en.bin || ./followspot download base.en
          test -f models/ggml-silero-v6.2.0.bin || ./followspot download vad
      - name: Launch the app
        # A release build only looks in its own models folder, as on a user's
        # Mac. The runner has no usable GPU; -ac 512 as in ci.yml.
        run: |
          models="$HOME/Library/Application Support/Followspot/models"
          mkdir -p "$models"
          cp models/ggml-base.en.bin models/ggml-silero-v6.2.0.bin "$models/"
          defaults write com.joekarlsson.followspot model "$models/ggml-base.en.bin"
          defaults write com.joekarlsson.followspot extraArgs -array --no-gpu -ac 512
          # An "update available" alert is modal and would stall the run.
          defaults write com.joekarlsson.followspot checkForUpdates -bool false
          open dist/Followspot.app
          for _ in $(seq 1 120); do
            curl -fs -o /dev/null http://127.0.0.1:8177/ && exit 0
            sleep 1
          done
          exit 1
      - name: Page and script are served through the staging folder
        run: |
          curl -fs http://127.0.0.1:8177/ | grep -q "<title>"
          curl -fs http://127.0.0.1:8177/demo.md > /dev/null
      - name: App passes the same whisper-server flags as ./followspot
        run: |
          macos/check-args.sh "$HOME/Library/Application Support/Followspot/server.args" \
            -m models/ggml-base.en.bin -- --no-gpu -ac 512
      - name: The bundled whisper-server transcribes
        # The first 4 s of the recorded fixture: "Hey, this is a quick test of
        # the prompter." One request proves the binary, its flags, and VAD
        # work together; whether tracking is good is ci.yml's question.
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { encodeWav } from "./public/audio.js";
            const pcm = readFileSync("test/fixtures/sample.wav").subarray(44, 44 + 4 * 16000 * 2);
            const samples = Float32Array.from({ length: pcm.length / 2 }, (_, i) => pcm.readInt16LE(i * 2) / 32768);
            writeFileSync("clip.wav", encodeWav(samples));'
          out=$(curl -fs http://127.0.0.1:8177/inference -F file=@clip.wav -F response_format=json)
          echo "$out"
          echo "$out" | grep -qiE "quick|test|prompter"
      - name: Quitting the app stops its server
        run: |
          osascript -e 'tell application "Followspot" to quit'
          for _ in $(seq 1 50); do
            pgrep -f "Followspot.app/Contents/Helpers/whisper-server" > /dev/null || exit 0
            sleep 0.2
          done
          echo "whisper-server still running after quit" >&2
          exit 1
      - name: Server log
        if: failure()
        run: cat "$HOME/Library/Application Support/Followspot/server.log" || true
      - name: Package the disk image
        run: macos/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Followspot-macOS
          path: dist/Followspot-*.dmg
          if-no-files-found: error

  release:
    name: Attach the disk image to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Followspot-macOS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Followspot-*.dmg --repo "$GITHUB_REPOSITORY" \
            --title "Followspot $GITHUB_REF_NAME" --generate-notes
