name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome (lint + format check)
        run: npx biome ci .
      - name: ShellCheck (launcher)
        run: shellcheck followspot

  e2e:
    name: End to end (whisper.cpp + macOS say)
    runs-on: macos-latest
    needs: [unit, lint]
    # Runner speed varies ~5x between identical runs; cap it so a slow or
    # stuck runner fails instead of holding a PR open.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install whisper.cpp and ffmpeg
        run: brew install whisper-cpp ffmpeg
      - name: Cache Whisper and VAD models
        uses: actions/cache@v6
        with:
          path: |
            models/ggml-base.en.bin
            models/ggml-silero-v6.2.0.bin
          key: whisper-ggml-base.en-silero-v6.2.0-v1
      - name: Download models
        run: |
          test -f models/ggml-base.en.bin || ./followspot download base.en
          test -f models/ggml-silero-v6.2.0.bin || ./followspot download vad
      - name: Start Followspot server
        # -ac 512: Whisper's encoder pads every request to 30 s of audio; 512
        # frames (~10 s) still covers the longest window, and cut CPU latency
        # ~4x in benchmarks (784 -> 197 ms median) with identical tracking.
        run: |
          ./followspot -m models/ggml-base.en.bin --no-open -- --no-gpu -ac 512 > server.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -fs -o /dev/null http://127.0.0.1:8178/ && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Runner info
        run: |
          echo "cpu: $(sysctl -n machdep.cpu.brand_string)  ncpu=$(sysctl -n hw.ncpu)  physical=$(sysctl -n hw.physicalcpu)  perf=$(sysctl -n hw.perflevel0.physicalcpu 2>/dev/null || echo n/a)"
          grep -E "^(Model|Threads|VAD):" server.log
      # One window per second instead of two: half the requests, and tracking
      # held (69-71/71) in local runs. The browser still uses 250 ms.
      - name: Simulated read-through
        run: node tools/simulate.mjs examples/sample.md --step 1
      - name: Simulated read-through, skipping every 3rd sentence
        run: node tools/simulate.mjs examples/sample.md --step 1 --skip 3
      - name: VAD returns nothing for silence
        run: |
          grep -q "^VAD:    models/ggml-silero" server.log
          ffmpeg -loglevel error -y -f lavfi -i anullsrc=r=16000:cl=mono -t 3 -c:a pcm_s16le silence.wav
          out=$(curl -s http://127.0.0.1:8178/inference -F file=@silence.wav -F response_format=json)
          echo "$out"
          test "$out" = '{"text":""}'
      - name: Server log
        if: failure()
        run: cat server.log
